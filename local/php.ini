; php.ini do ambiente local de QA do Diário. Usado só por local/iniciar.ps1 (php -c).
; Não altera a instalação do PHP nem o repositório da aplicação.
extension_dir = "ext"
extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = mysqli
extension = openssl

memory_limit = 256M
; Mesmos limites do WAMP usado pelo time (limite efetivo de upload: 2 MB).
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 20

; CodeIgniter 3 gera avisos de depreciação no PHP 8.1: ficam só no log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = America/Recife
default_charset = "UTF-8"
